<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}IRONHUB Sivagangai{% endblock %}</title>
    <meta
      name="description"
      content="IRONHUB is a strength gym in Sivagangai for serious training, group classes, and personal coaching."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="noise"></div>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">IH</span>
        <span>
          <strong>IRONHUB</strong>
          <small>Sivagangai</small>
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Open menu">☰</button>
      <nav class="site-nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('training') }}">Training</a>
        <a href="{{ url_for('membership') }}">Membership</a>
        <a href="{{ url_for('contact') }}">Join</a>
      </nav>
      <a class="btn btn-accent header-cta" href="{{ url_for('contact') }}">Book a visit</a>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="footer-grid">
        <div>
          <p class="brand-plain">IRONHUB</p>
          <p>{{ tagline }}</p>
        </div>
        <div>
          <h3>Visit</h3>
          <p>{{ gym_address }}</p>
          <p>{{ hours_week }}<br />{{ hours_sunday }}</p>
        </div>
        <div>
          <h3>Talk to us</h3>
          <p><a href="tel:{{ gym_tel }}">{{ gym_phone }}</a></p>
          <p><a href="mailto:{{ gym_email }}">{{ gym_email }}</a></p>
        </div>
      </div>
      <p class="copyright">© {{ year }} IRONHUB Sivagangai. Built for local athletes.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
